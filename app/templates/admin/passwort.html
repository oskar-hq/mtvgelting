{% extends "admin/rahmen.html" %}
{% set aktiv = 'passwort' %}
{% block titel %}Passwort ändern{% endblock %}
{% block inhalt %}
<h1>Passwort ändern</h1>
<form method="post" class="formular">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <div class="feld">
    <label for="alt">Bisheriges Passwort</label>
    <input id="alt" name="alt" type="password" required autocomplete="current-password">
  </div>
  <div class="feld">
    <label for="neu">Neues Passwort</label>
    <input id="neu" name="neu" type="password" required minlength="10" autocomplete="new-password">
    <span class="hinweis">Mindestens 10 Zeichen.</span>
  </div>
  <div class="feld">
    <label for="neu2">Neues Passwort wiederholen</label>
    <input id="neu2" name="neu2" type="password" required minlength="10" autocomplete="new-password">
  </div>
  <p class="knopfzeile"><button class="knopf knopf--haupt" type="submit">Passwort ändern</button></p>
</form>
{% endblock %}
