<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Anmelden{% endblock %} — Vereinsverwaltung</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
<link rel="icon" href="/assets/img/favicon.png" type="image/png" sizes="128x128">
</head>
<body class="anmeldung">
<main class="karte">
  <img class="karte__logo" src="/assets/img/logo.png" alt="" width="45" height="60">
  {% with meldungen = get_flashed_messages(with_categories=true) %}
    {% for art, text in meldungen %}
      <p class="meldung meldung--{{ art }}" role="alert">{{ text }}</p>
    {% endfor %}
  {% endwith %}
  {% block inhalt %}{% endblock %}
</main>
<p class="anmeldung__zurueck"><a href="/">← Zurück zur Website</a></p>
</body>
</html>
