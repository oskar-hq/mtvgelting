<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img" aria-label="Wappen des MTV Gelting 08">
  <title>MTV Gelting 08</title>
  <defs>
    <path id="feld" d="M14 30 H106 V95 C106 117 89 133 60 144 C31 133 14 117 14 95 Z"/>
    <clipPath id="feldClip"><use href="#feld"/></clipPath>
  </defs>

  <!-- Wappenkontur -->
  <path d="M3 3 H117 V96 C117 123 96 142 60 157 C24 142 3 123 3 96 Z"
        fill="#FFFFFF" stroke="#1D4E7C" stroke-width="6" stroke-linejoin="round"/>

  <!-- MTV im Kopf des Wappens -->
  <text x="60" y="26" text-anchor="middle" fill="#1D4E7C"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="1.5">MTV</text>

  <!-- Inneres Feld -->
  <use href="#feld" fill="#1D4E7C"/>

  <!-- Gründungsjahr -->
  <text x="33" y="62" text-anchor="middle" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', serif" font-size="22">19</text>
  <text x="87" y="116" text-anchor="middle" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', serif" font-size="22">08</text>

  <!-- Diagonalband mit Ortsnamen -->
  <g clip-path="url(#feldClip)">
    <path d="M-3.2 122.8 L23.2 147.2 L123.2 38.2 L96.8 13.8 Z" fill="#FFFFFF"/>
    <text transform="translate(60 80.5) rotate(-47.5)" text-anchor="middle" fill="#1D4E7C"
          font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="0.5"
          dominant-baseline="central">GELTING</text>
  </g>
</svg>
