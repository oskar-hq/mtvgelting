<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" role="img" aria-label="Wappen des MTV Gelting 08">
  <title>MTV Gelting 08</title>
  <defs>
    <!-- Inneres Feld: oben rechteckig, unten der Wappenform folgend -->
    <path id="feld" d="M8 28 H112 V116 C112 130 92 142 60 150 C28 142 8 130 8 116 Z"/>
    <clipPath id="feldClip"><use href="#feld"/></clipPath>
  </defs>

  <!-- Wappenkontur: gerade Seiten bis auf drei Viertel Höhe, dann Spitze -->
  <path d="M4.5 4.5 H115.5 V120 C115.5 136 94 150 60 157.5 C26 150 4.5 136 4.5 120 Z"
        fill="#FFFFFF" stroke="#1D4E7C" stroke-width="5" stroke-linejoin="round"/>

  <text x="60" y="24" text-anchor="middle" fill="#1D4E7C"
        font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="2">MTV</text>

  <use href="#feld" fill="#1D4E7C"/>

  <text x="30" y="63" text-anchor="middle" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', serif" font-size="21">19</text>
  <text x="90" y="112" text-anchor="middle" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', serif" font-size="21">08</text>

  <g clip-path="url(#feldClip)">
    <path d="M-6.9 117.2 L22.9 146.9 L126.9 42.9 L97.2 13.2 Z" fill="#FFFFFF"/>
    <text transform="translate(60 80) rotate(-45)" text-anchor="middle" fill="#1D4E7C"
          font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="2"
          dominant-baseline="central">GELTING</text>
  </g>
</svg>
