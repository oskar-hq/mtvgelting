# Deployt die Seite über GitHub Actions.
#
# Nur nötig, wenn unter Settings > Pages als Source "GitHub Actions" gewählt ist.
# Bei der Einstellung "Deploy from a branch" veröffentlicht GitHub den Branch
# direkt und dieser Workflow wird nicht gebraucht.
#
# Läuft bewusst nur auf Zuruf, damit er nicht bei jedem Push fehlschlägt,
# solange Pages noch nicht eingerichtet ist.
name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
