name: GitHub Pages

on:
  push:
    branches: [claude/mtv-gelting-audit-3jknqv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seiten aus data/ neu erzeugen
        run: python3 tools/build.py

      - name: Prüfen, dass die eingecheckten Seiten zu den Daten passen
        run: |
          if ! git diff --exit-code; then
            echo "::error::Die erzeugten Seiten weichen von den eingecheckten ab. Bitte 'python3 tools/build.py' ausführen und das Ergebnis committen."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
