# Holt die Inhalte aus dem CMS, baut die Seiten und veröffentlicht sie.
#
# Läuft automatisch, sobald im Sanity-Studio etwas gespeichert wird: Sanity
# ruft dann per Webhook die GitHub-API auf und löst „repository_dispatch“ aus.
# Die Einrichtung dieses Webhooks steht in studio/README.md.
name: Website veröffentlichen

on:
  repository_dispatch:
    types: [sanity-update]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur eine Veröffentlichung; spätere warten, statt sich zu
# überholen. Nicht abbrechen — sonst ginge die zuletzt gespeicherte Änderung
# verloren.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inhalte holen und Seiten bauen
        env:
          SANITY_PROJEKT: ${{ vars.SANITY_PROJEKT }}
          SANITY_DATENSATZ: ${{ vars.SANITY_DATENSATZ || 'production' }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        # Ausdrücklich „cms“: fehlt die Einrichtung, soll der Lauf sichtbar
        # scheitern und nicht stillschweigend einen alten Stand veröffentlichen.
        run: python3 tools/build.py --quelle cms --ziel _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Nur der Ausgabeordner — nicht der Quellcode des Projekts.
          path: _site

      - id: veroeffentlichen
        uses: actions/deploy-pages@v4
