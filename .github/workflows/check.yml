name: Seiten prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python3 -m pip install -r requirements.txt

      - name: Seiten aus data/ neu erzeugen
        run: python3 tools/build.py

      - name: Prüfen, dass die eingecheckten Seiten zu den Daten passen
        run: |
          if ! git diff --exit-code; then
            echo "::error::Die erzeugten Seiten weichen von den eingecheckten ab. Bitte 'python3 tools/build.py' ausführen und das Ergebnis committen."
            exit 1
          fi

      - name: Tests für Datenbank und Verwaltungsbereich
        run: python3 -m unittest discover -s tests -v
