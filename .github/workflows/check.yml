# Prüft bei jedem Push, dass Generator und CMS-Anbindung funktionieren.
# Kommt ohne CMS-Zugang aus: gebaut wird aus den Dateien in data/.
name: Seiten prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Seiten aus data/ bauen
        run: python3 tools/build.py --quelle dateien --ziel "${RUNNER_TEMP}/bau"

      - name: Alle sieben Seiten sind entstanden
        run: |
          anzahl=$(ls "${RUNNER_TEMP}/bau"/*.html | wc -l)
          echo "Erzeugt: $anzahl Seiten"
          test "$anzahl" -eq 7

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Abhängigkeiten des Studios
        working-directory: studio
        run: npm ci --no-audit --no-fund

      - name: Schema prüfen
        working-directory: studio
        run: npx --no-install sanity schema validate
